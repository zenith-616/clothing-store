<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bosh sahifa | Kiyim do'koni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="app-nav">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap">
      <a class="brand-serif" href="dashboard.html">Kiyim do'koni</a>
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a class="nav-link active" href="dashboard.html">Bosh sahifa</a>
        <a class="nav-link" href="products.html">Mahsulotlar</a>
        <a class="nav-link" href="orders.html">Buyurtmalar</a>
        <a class="nav-link" href="customers.html">Mijozlar</a>
        <button class="btn-logout" onclick="logout()">Chiqish</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="page-header mb-4">
      <h4>Bosh sahifa</h4>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <!-- STATISTIKA KARTALARI -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-label">Bugungi buyurtmalar</div>
          <div class="stat-value" id="statTodayOrders">–</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-label">Bugungi daromad</div>
          <div class="stat-value" id="statTodayRevenue">–</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-label">Yangi buyurtmalar</div>
          <div class="stat-value" id="statNewOrders">–</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat-card stat-card-warn">
          <div class="stat-label">Kam qolgan variantlar</div>
          <div class="stat-value" id="statLowStock">–</div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="data-panel p-4">
          <h6 class="brand-serif mb-3">Umumiy ko'rsatkichlar</h6>
          <div class="d-flex justify-content-between py-2 border-bottom">
            <span class="text-muted">Jami buyurtmalar</span>
            <strong id="statTotalOrders">–</strong>
          </div>
          <div class="d-flex justify-content-between py-2">
            <span class="text-muted">Jami daromad</span>
            <strong id="statTotalRevenue">–</strong>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="data-panel p-4">
          <h6 class="brand-serif mb-3">Eng ko'p sotilgan mahsulotlar</h6>
          <div id="topProducts"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

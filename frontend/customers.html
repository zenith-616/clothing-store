<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijozlar | Kiyim do'koni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="app-nav">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap">
      <a class="brand-serif" href="dashboard.html">Kiyim do'koni</a>
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a class="nav-link" href="dashboard.html">Bosh sahifa</a>
        <a class="nav-link" href="products.html">Mahsulotlar</a>
        <a class="nav-link" href="orders.html">Buyurtmalar</a>
        <a class="nav-link active" href="customers.html">Mijozlar</a>
        <button class="btn-logout" onclick="logout()">Chiqish</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="page-header d-flex justify-content-between align-items-center mb-3">
      <h4>Mijozlar</h4>
      <button class="btn-gold" onclick="openCustomerModal()">+ Mijoz qo'shish</button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12 col-md-5">
        <input type="text" id="searchInput" class="form-control" placeholder="Ism yoki telefon bo'yicha qidirish...">
      </div>
      <div class="col-6 col-md-2">
        <button class="btn btn-outline-dark w-100" onclick="loadCustomers()">Qidirish</button>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="data-panel">
      <div class="table-responsive">
        <table class="table data-table">
          <thead>
            <tr>
              <th>Ism</th>
              <th>Telefon</th>
              <th>Manzil</th>
              <th>Buyurtmalar</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="customersBody">
            <tr><td colspan="5" class="text-center text-muted py-4">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MIJOZ QO'SHISH/TAHRIRLASH MODAL -->
  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content product-modal">
        <div class="modal-header">
          <h5 class="modal-title brand-serif" id="customerModalTitle">Yangi mijoz</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="customerModalError" class="alert alert-danger d-none"></div>
          <input type="hidden" id="customerId">
          <div class="mb-3">
            <label class="form-label">To'liq ism</label>
            <input type="text" class="form-control" id="cFullName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="text" class="form-control" id="cPhone" placeholder="+998901234567" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Manzil</label>
            <input type="text" class="form-control" id="cAddress">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Bekor qilish</button>
          <button type="button" class="btn-gold" id="saveCustomerBtn">Saqlash</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MIJOZ BUYURTMALARI MODAL -->
  <div class="modal fade" id="customerOrdersModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content product-modal">
        <div class="modal-header">
          <h5 class="modal-title brand-serif" id="customerOrdersTitle">Buyurtmalar tarixi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <table class="table variant-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Sana</th>
                <th>Summa</th>
                <th>Holati</th>
              </tr>
            </thead>
            <tbody id="customerOrdersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>

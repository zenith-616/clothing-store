<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xodimlar | Kiyim do'koni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="app-nav">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap">
      <a class="brand-serif" href="dashboard.html">Kiyim do'koni</a>
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a class="nav-link" href="dashboard.html">Bosh sahifa</a>
        <a class="nav-link" href="products.html">Mahsulotlar</a>
        <a class="nav-link" href="orders.html">Buyurtmalar</a>
        <a class="nav-link" href="customers.html">Mijozlar</a>
        <a class="nav-link active" href="employees.html">Xodimlar</a>
        <button class="btn-logout" onclick="logout()">Chiqish</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="page-header d-flex justify-content-between align-items-center mb-3">
      <h4>Xodimlar</h4>
      <button class="btn-gold" onclick="openEmployeeModal()">+ Xodim qo'shish</button>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="data-panel">
      <div class="table-responsive">
        <table class="table data-table">
          <thead>
            <tr>
              <th>Ism</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Holati</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="employeesBody">
            <tr><td colspan="5" class="text-center text-muted py-4">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="employeeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content product-modal">
        <div class="modal-header">
          <h5 class="modal-title brand-serif" id="employeeModalTitle">Yangi xodim</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="employeeModalError" class="alert alert-danger d-none"></div>
          <input type="hidden" id="employeeId">
          <div class="mb-3">
            <label class="form-label">To'liq ism</label>
            <input type="text" class="form-control" id="eFullName" required>
          </div>
          <div class="mb-3" id="emailField">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="eEmail" required>
          </div>
          <div class="mb-3" id="passwordField">
            <label class="form-label">Parol</label>
            <input type="password" class="form-control" id="ePassword" autocomplete="new-password">
            <ul class="pw-rules" id="pwRules">
              <li data-rule="len">Kamida 8 ta belgi</li>
              <li data-rule="digit">Kamida 1 ta raqam</li>
              <li data-rule="upper">Kamida 1 ta katta harf</li>
            </ul>
          </div>
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" id="eRole">
              <option value="operator">Operator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-3 d-none" id="activeField">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="eActive" checked>
              <label class="form-check-label" for="eActive">Faol</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Bekor qilish</button>
          <button type="button" class="btn-gold" id="saveEmployeeBtn">Saqlash</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish | Kiyim do'koni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow login-card">
          <div class="card-body p-4">
            <h3 class="text-center mb-1">Kiyim do'koni</h3>
            <p class="text-center text-muted mb-4">Admin panelga kirish</p>

            <div id="error" class="alert alert-danger d-none"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Parol</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="loginBtn">Kirish</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("d-none");
      btn.disabled = true;
      btn.textContent = "Kutilmoqda...";

      try {
        await login(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        window.location.href = "products.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirish";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahsulotlar | Kiyim do'koni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="app-nav">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap">
      <a class="brand-serif" href="products.html">Kiyim do'koni</a>
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a class="nav-link active" href="products.html">Mahsulotlar</a>
        <a class="nav-link" href="orders.html">Buyurtmalar</a>
        <a class="nav-link" href="customers.html">Mijozlar</a>
        <button class="btn-logout" onclick="logout()">Chiqish</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="page-header d-flex justify-content-between align-items-center mb-3">
      <h4>Mahsulotlar</h4>
      <button class="btn-gold" onclick="openProductModal()">+ Mahsulot qo'shish</button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12 col-md-5">
        <input type="text" id="searchInput" class="form-control" placeholder="Mahsulot nomi bo'yicha qidirish...">
      </div>
      <div class="col-6 col-md-3">
        <select id="categoryFilter" class="form-select">
          <option value="">Barcha kategoriyalar</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <button class="btn btn-outline-dark w-100" onclick="loadProducts()">Qidirish</button>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="data-panel">
      <div class="table-responsive">
        <table class="table data-table">
          <thead>
            <tr>
              <th>Nomi</th>
              <th>Kategoriya</th>
              <th>Brend</th>
              <th>Narxi</th>
              <th>Holati</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productsBody">
            <tr><td colspan="6" class="text-center text-muted py-4">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content product-modal">
      <div class="modal-header">
        <h5 class="modal-title brand-serif" id="productModalTitle">Yangi mahsulot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalError" class="alert alert-danger d-none"></div>
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Nomi</label>
              <input type="text" class="form-control" id="pName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Narxi (so'm)</label>
              <input type="number" class="form-control" id="pPrice" min="0" step="1000" required>
            </div>
            <div class="col-12">
              <label class="form-label">Tavsif</label>
              <textarea class="form-control" id="pDescription" rows="2"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Kategoriya</label>
              <select class="form-select" id="pCategory" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Brend</label>
              <select class="form-select" id="pBrand"><option value="">Brendsiz</option></select>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="pActive" checked>
                <label class="form-check-label" for="pActive">Sotuvda (faol)</label>
              </div>
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="brand-serif mb-0">Variantlar</h6>
            <button type="button" class="btn-edit" id="addVariantRow">+ Variant</button>
          </div>
          <div class="table-responsive">
            <table class="table variant-table align-middle">
              <thead>
                <tr>
                  <th>O'lcham</th>
                  <th>Rang</th>
                  <th>Ombor</th>
                  <th>SKU</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="variantRows"></tbody>
            </table>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Bekor qilish</button>
        <button type="button" class="btn-gold" id="saveProductBtn">Saqlash</button>
      </div>
    </div>
  </div>
</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
